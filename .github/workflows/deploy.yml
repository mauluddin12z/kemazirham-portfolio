name: CI/CD Auto Deploy (PM2 + Tailscale)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # 1. Build dan test di GitHub runner
  build-and-test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build

  # 2. Deploy melalui private Tailscale network
  deploy:
    name: Deploy to Server via Tailscale
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}

    steps:
      # METODE A: Hubungkan ke Tailscale menggunakan Auth Key (Paling mudah & direkomendasikan)
      - name: Connect to Tailscale (Auth Key)
        if: env.TS_AUTHKEY != ''
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # METODE B: Hubungkan ke Tailscale menggunakan OAuth Client (Jika pakai Client ID & Secret)
      - name: Connect to Tailscale (OAuth)
        if: env.TS_AUTHKEY == '' && env.TS_CLIENT_ID != ''
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Cek ketersediaan host di jaringan Tailscale
      - name: Verify Tailscale Connection
        run: |
          echo "Memverifikasi koneksi ke host Tailscale: ${{ secrets.SSH_HOST }}"
          ping -c 3 ${{ secrets.SSH_HOST }} || echo "Ping tidak direspons, melanjutkan ke SSH..."

      # Akses VPS / Homeserver melalui IP Tailscale (100.x.y.z atau MagicDNS)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          script: |
            set -e

            # Muat NVM & PATH Node/PM2 di server
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$PATH:/usr/local/bin:/usr/bin:$HOME/.npm-global/bin"

            # Masuk ke direktori aplikasi
            cd /data/kemazirham-portfolio || cd "$HOME/kemazirham-portfolio" || exit 1

            echo "🚀 [1/4] Pulling latest changes from GitHub..."
            git pull origin main

            echo "📦 [2/4] Installing dependencies..."
            npm install --prefer-offline --no-audit

            echo "🏗️ [3/4] Building Next.js..."
            npm run build

            echo "♻️ [4/4] Reloading PM2 with Zero-Downtime..."
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            pm2 save

            echo "🎉 Deployment completed successfully!"
