name: CI/CD Auto Deploy (PM2 + Tailscale)

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ==========================================
  # 1. BUILD AND TEST
  # ==========================================

  build-and-test:
    name: Test & Build Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build

  # ==========================================
  # 2. DEPLOY THROUGH TAILSCALE
  # ==========================================

  deploy:
    name: Deploy to VPS via Tailscale
    runs-on: ubuntu-latest

    needs: build-and-test

    if: github.ref == 'refs/heads/main'

    steps:
      # ----------------------------------------
      # CHECKOUT
      # ----------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # CONNECT TAILSCALE
      # ----------------------------------------

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # ----------------------------------------
      # VERIFY TAILSCALE
      # ----------------------------------------

      - name: Verify Tailscale Connection
        run: |
          echo "=================================="
          echo "TAILSCALE STATUS"
          echo "=================================="

          tailscale status

          echo ""
          echo "Checking VPS connectivity..."

          # DERP relay juga merupakan koneksi valid.
          # Jangan mewajibkan direct connection.
          tailscale ping \
            --timeout=30s \
            "${{ secrets.SSH_HOST }}" || true

          echo ""
          echo "Checking TCP connectivity..."

          nc -zv -w 15 \
            "${{ secrets.SSH_HOST }}" \
            "${{ secrets.SSH_PORT || '22' }}"

          echo ""
          echo "VPS SSH connectivity verified!"

      # ----------------------------------------
      # CHECK SSH PORT
      # ----------------------------------------

      - name: Check SSH Port
        run: |
          SSH_HOST="${{ secrets.SSH_HOST }}"
          SSH_PORT="${{ secrets.SSH_PORT || '22' }}"

          echo "Checking SSH connection..."
          echo "Host: $SSH_HOST"
          echo "Port: $SSH_PORT"

          for i in 1 2 3 4 5; do

            if nc -zv -w 10 "$SSH_HOST" "$SSH_PORT"; then
              echo "SSH port is accessible!"
              exit 0
            fi

            echo "Attempt $i failed. Retrying..."
            sleep 5

          done

          echo "ERROR: Cannot connect to SSH port"
          exit 1

      # ----------------------------------------
      # DEPLOY VIA SSH
      # ----------------------------------------

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}

          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: ${{ secrets.SSH_PORT || '22' }}

          timeout: 60s
          command_timeout: 15m

          script_stop: true
          debug: false

          script: |
            set -e

            echo "=================================="
            echo "STARTING PRODUCTION DEPLOYMENT"
            echo "=================================="

            # --------------------------------
            # LOAD NVM
            # --------------------------------

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            export PATH="$PATH:/usr/local/bin:/usr/bin:$HOME/.npm-global/bin"

            echo "Node version:"
            node -v

            echo "NPM version:"
            npm -v

            # --------------------------------
            # APPLICATION DIRECTORY
            # --------------------------------

            APP_DIR="/data/kemazirham-portfolio"

            if [ ! -d "$APP_DIR" ]; then
              APP_DIR="$HOME/kemazirham-portfolio"
            fi

            if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: Application directory not found"
              exit 1
            fi

            cd "$APP_DIR"

            echo "Application directory: $APP_DIR"

            # --------------------------------
            # PULL LATEST CHANGES
            # --------------------------------

            echo ""
            echo "[1/4] Pulling latest changes..."

            git pull --ff-only origin main

            # --------------------------------
            # INSTALL DEPENDENCIES
            # --------------------------------

            echo ""
            echo "[2/4] Installing dependencies..."

            npm ci --prefer-offline --no-audit

            if [ -d "cms" ]; then
              echo "Installing & building Strapi CMS..."
              cd cms && npm ci --prefer-offline --no-audit && npm run build && cd ..
            fi

            # --------------------------------
            # BUILD NEXT.JS
            # --------------------------------

            echo ""
            echo "[3/4] Building Next.js..."

            npm run build

            # --------------------------------
            # RELOAD PM2
            # --------------------------------

            echo ""
            echo "[4/4] Reloading PM2..."

            if pm2 describe kemazirham-portfolio > /dev/null 2>&1; then
              pm2 reload ecosystem.config.js --env production
            else
              pm2 start ecosystem.config.js --env production
            fi

            pm2 save

            echo ""
            echo "=================================="
            echo "DEPLOYMENT COMPLETED SUCCESSFULLY!"
            echo "=================================="

            pm2 status
