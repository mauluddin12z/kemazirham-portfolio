name: CI/CD Auto Deploy (PM2 + Tailscale)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build

  deploy:
    name: Deploy to Server via Tailscale
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Verify Tailscale
        run: |
          tailscale status
          tailscale ping --timeout=10s "${{ secrets.SSH_HOST }}"

      - name: Check SSH Port
        run: |
          nc -zv -w 10 \
            "${{ secrets.SSH_HOST }}" \
            "${{ secrets.SSH_PORT || '22' }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          timeout: 60s
          command_timeout: 15m
          script_stop: true

          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            export PATH="$PATH:/usr/local/bin:/usr/bin:$HOME/.npm-global/bin"

            cd /data/kemazirham-portfolio || \
              cd "$HOME/kemazirham-portfolio"

            echo "🚀 [1/4] Pulling latest changes..."
            git pull origin main

            echo "📦 [2/4] Installing dependencies..."
            npm ci --prefer-offline --no-audit

            echo "🏗️ [3/4] Building Next.js..."
            npm run build

            echo "♻️ [4/4] Reloading PM2..."
            pm2 reload ecosystem.config.js --env production || \
              pm2 start ecosystem.config.js --env production

            pm2 save

            echo "🎉 Deployment completed successfully!"
